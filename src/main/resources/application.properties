spring.application.name=sistema_gestor_incidencias
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.url=jdbc:postgresql://localhost:5432/db_gestor_incidencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Credenciales en el archivo .env (ver .env.example)
spring.datasource.username=${DB_USERNAME:${env.DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${env.DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
config.jwt.secret=${JWT_SECRET:${env.JWT_SECRET}}

# Notificaciones por correo de cambios en incidencias (Formspree)
notificacion.habilitada=true
# Formspree solo entrega al dueño del formulario (no al solicitante); queda apagado.
# Ponlo en true si quieres una copia de cada aviso en la bandeja de Formspree.
notificacion.formspree.habilitada=false
notificacion.formspree.url=https://formspree.io/f/xbglbbgk

# SMTP: envía el aviso directamente al correo del solicitante.
# Credenciales en el archivo .env (ver .env.example). Con Gmail usa una "contraseña de aplicación".
# Carga el .env del backend tanto si se arranca desde su carpeta como desde la raíz Proyecto_TI.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend_sistema_gestor_incidencias/backend_sistema_gestor_incidencias/.env[.properties]
# Acepta la variable directa (MAIL_X) o con el prefijo de spring-dotenv (env.MAIL_X).
spring.mail.host=${MAIL_HOST:${env.MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${env.MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${env.MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${env.MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
notificacion.correo.remitente=${MAIL_FROM:${env.MAIL_FROM:}}

# Orígenes permitidos por CORS (separados por coma). Al desplegar, agrega el dominio del frontend.
app.cors.allowed-origins=http://localhost:[*],http://127.0.0.1:[*]
